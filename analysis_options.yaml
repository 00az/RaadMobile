include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated from the pinned C1 contract; `dart run swagger_parser --check`
    # guards it instead. Never edit these files by hand.
    - lib/api/generated/**
  language:
    strict-casts: true
    strict-raw-types: true
