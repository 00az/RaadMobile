# Arabic and English text for every screen (US5.1, BR3.7).
# `flutter gen-l10n` (also run by `flutter pub get`) writes the Dart lookup
# classes next to the catalogs. `dart run tool/check_l10n.dart` checks that
# both catalogs hold every key with a non-empty value.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
format: true
